<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><style>.bg{fill:#f4f7fb}.nav{fill:#18375f}.card{fill:#fff;stroke:#dce5f0;stroke-width:2}.muted{fill:#71849b;font:20px 'Segoe UI','Malgun Gothic',sans-serif}.text{fill:#20334b;font:22px 'Segoe UI','Malgun Gothic',sans-serif}.title{fill:#17365d;font:bold 34px 'Segoe UI','Malgun Gothic',sans-serif}.small{fill:#71849b;font:16px 'Segoe UI','Malgun Gothic',sans-serif}.blue{fill:#416bc4}.green{fill:#24815f}.orange{fill:#b97822}.line{stroke:#e4eaf2;stroke-width:2}</style></defs><rect class="bg" width="1280" height="800"/><rect class="nav" width="250" height="800"/><text x="32" y="55" fill="white" font-size="28" font-weight="700">CALIBRA</text><text x="32" y="95" fill="#c7d5e8" font-size="18">계측기 통합관리</text><g fill="#d7e2f0" font-size="19" font-family="sans-serif"><text x="34" y="165">▦　대시보드</text><text x="34" y="220">◉　계측기 관리</text><text x="34" y="275">▣　검교정 계획</text><text x="34" y="330">▣　검교정 이력</text><text x="34" y="385">∿　통계적 공정관리</text></g><text class="small" x="295" y="60">CALIBRATION · PLAN &amp; HISTORY</text><text class="title" x="295" y="110">검교정 계획 · 실적</text><text class="muted" x="295" y="145">연간 계획과 완료 이력, 결과와 차기 일정을 함께 관리합니다.</text><rect class="card" x="295" y="180" width="925" height="110" rx="16"/><text class="small" x="325" y="222">올해 계획</text><text class="title" x="325" y="263">24건</text><text class="small" x="545" y="222">완료 실적</text><text class="title" x="545" y="263">18건</text><text class="small" x="770" y="222">완료율</text><text class="title" x="770" y="263">75%</text><text class="small" x="990" y="222">임박 · 만료</text><text class="title" x="990" y="263">4건</text><rect class="card" x="295" y="315" width="925" height="430" rx="16"/><text class="text" x="325" y="360" font-weight="700">2026년 검교정 일정</text><g class="small" text-anchor="middle"><text x="392" y="405">1월</text><text x="515" y="405">2월</text><text x="638" y="405">3월</text><text x="761" y="405">4월</text><te