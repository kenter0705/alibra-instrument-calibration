<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d"><title id="t">CALIBRA 홈 대시보드 화면 미리보기</title><desc id="d">검교정 현황 카드, 계획 대비 실적, 다가오는 일정과 업무 바로가기 화면</desc><defs><style>.ui{font-family:'Segoe UI','Malgun Gothic',sans-serif}.muted{fill:#7889a0}.ink{fill:#233650}.blue{fill:#4d72cc}.small{font-size:13px}.tiny{font-size:11px}</style></defs><rect width="1280" height="800" fill="#f4f7fb"/><rect x="0" y="0" width="250" height="800" fill="#1d3152"/><rect x="24" y="24" width="42" height="42" rx="12" fill="#3d5e95"/><path d="M34 49a11 11 0 1 1 22 0M45 48l7-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text class="ui" x="78" y="46" font-size="20" font-weight="700" fill="#fff">CALIBRA</text><text class="ui" x="78" y="66" font-size="12" fill="#b9c8de">계측기 통합관리</text><rect x="18" y="105" width="214" height="42" rx="9" fill="#2b4167"/><circle cx="35" cy="126" r="5" fill="#58c396"/><text class="ui" x="50" y="131" font-size="14" fill="#fff">개인 작업공간</text><text class="ui" x="24" y="183" font-size="11" letter-spacing="2" fill="#9eb0c9">WORKSPACE</text><g class="ui" font-size="15" fill="#d6e0ef"><rect x="15" y="199" width="220" height="43" rx="9" fill="#4b70c5"/><text x="40" y="226" fill="#fff" font-weight="700">▦　대시보드</text><text x="40" y="278">◉　계측기 관리</text><text x="40" y="328">▦　검교정 계획</text><text x="40" y="378">▣　검교정 이력</text><text x="40" y="428">⌁　구매 관리</text><text x="40" y="478">↗　불출 및 반납</text><text x="40" y="528">ⓘ　분실 및 폐기 관리</text><text x="40" y="578">⌁　비용 및 예산 관리</text><text x="40" y="628">✓　전자결재</text><text x="40" y="678">⌁　측정시스템 분석</text></g><rect x="250" width="1030" height="68" fill="#fff"/><path d="M250 68H1280" stroke="#dce5f0"/><text class="ui muted" x="285" y="41" font-size="14">워크스페이스　/　대시보드</text><rect x="1000" y="17" width="190" height="35" rx="9" fill="#fff" stroke="#dce5f0"/><text class="ui muted small" x="1020" y="39">⌕　계측기, 메뉴 검색</text><text class="ui muted" x="285" y="112" font-size="12" letter-spacing="1.5">TUESDAY, NOVEMBER 10, 2026</text><text class="ui ink" x="285" y="151" font-size="30" font-weight="600">좋은 하루입니다, 관리자님 👋</text><text class="ui muted" x="285" y="181" font-size="14">품질은 수치로 말한다. 정확한 측정과 통계적 관리가 품질의 기본 요건입니다.</text><rect x="285" y="207" width="955" height="200" rx="14" fill="#fff" stroke="#dce5f0"/><text class="ui blue" x="313" y="244" font-size="12" font-weight="700" letter-spacing="1.4">MEASURE · ANALYZE · IMPROVE</text><text class="ui ink" x="313" y="282" font-size="26" font-weight="600">품질을 수치로 관리합니다</text><text class="ui muted" x="313" y="313" font-size="14">계측기 자산과 검교정 일정을 확인하고, 공정 측정 데이터 분석으로</text><text class="ui muted" x="313" y="335" font-size="14">개선 방향을 찾습니다.</text><text class="ui blue" x="313" y="371" font-size="14" font-weight="700">통계적 공정관리 열기　→</text><g><circle cx="1034" cy="301" r="82" fill="#eef3fb"/><path d="M961 300a73 73 0 0 1 146 0" fill="none" stroke="#7290cf" stroke-width="17" stroke-linecap="round"/><path d="M968 291a67 67 0 0 1 33-54" fill="none" stroke="#d77876" stroke-width="15"/><path d="M1002 237a67 67 0 0 1 65 0" fill="none" stroke="#e7b85d" stroke-width="15"/><path d="M1067 237a67 67 0 0 1 33 54" fill="none" stroke="#8ac79a" stroke-width="15"/><circle cx="1034" cy="301" r="14" fill="#526d9c"/><path d="M1034 301l48-36" stroke="#354a70" stroke-width="6" stroke-linecap="round"/><circle cx="985" cy="259" r="14" fill="#b65c55"/><circle cx="1034" cy="230" r="14" fill="#c89145"/><circle cx="1083" cy="259" r="14" fill="#61946b"/><text class="ui" x="980" y="264" font-size="15" fill="#fff">☹</text><text class="ui" x="1029" y="235" font-size="15" fill="#fff">━</text><text class="ui" x="1078" y="264" font-size="15" fill="#fff">☺</text></g><g class="ui"><rect x="285" y="430" width="220" height="100" rx="12" fill="#fff" stroke="#dce5f0"/><rect x="520" y="430" width="220" height="100" rx="12" fill="#fff" stroke="#dce5f0"/><rect x="755" y="430" width="220" height="100" rx="12" fill="#fff" stroke="#dce5f0"/><rect x="990