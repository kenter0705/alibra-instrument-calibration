 y="377" font-size="25" fill="#245c6a" font-weight="700">1,000</text><rect x="525" y="298" width="225" height="105" rx="12" fill="#fff" stroke="#dde6ee"/><text x="542" y="332" font-size="15" fill="#7c91a3" font-weight="400">검사수준 / AQL</text><text x="542" y="377" font-size="25" fill="#245c6a" font-weight="700">일반 II / 2.5%</text><rect x="770" y="298" width="225" height="105" rx="12" fill="#fff" stroke="#dde6ee"/><text x="787" y="332" font-size="15" fill="#7c91a3" font-weight="400">검사수량 n</text><text x="787" y="377" font-size="25" fill="#245c6a" font-weight="700">80개</text><rect x="1015" y="298" width="225" height="105" rx="12" fill="#fff" stroke="#dde6ee"/><text x="1032" y="332" font-size="15" fill="#7c91a3" font-weight="400">합격 / 불합격</text><text x="1032" y="377" font-size="25" fill="#245c6a" font-weight="700">Ac 5 / Re 6</text><rect x="280" y="429" width="960" height="290" rx="12" fill="#fff" stroke="#dde6ee"/><text x="303" y="469" font-size="23" fill="#294b64" font-weight="700">표본문자 → 검사수량 → 판정 개수</text><rect x="303" y="487" width="505" height="47" rx="6" fill="#f6f8fb" stroke="none"/><text x="322" y="512" font-size="18" fill="#29465e" font-weight="400">281–500</text><text x="551" y="512" font-size="20" fill="#1c6170" font-weight="700">H</text><text x="677" y="512" font-size="19" fill="#29465e" font-weight="400">50개</text><rect x="303" y="543" width="505" height="47" rx="6" fill="#e7f2f2" stroke="none"/><text x="322" y="568" font-size="18" fill="#29465e" font-weight="400">501–1,200</text><text x="551" y="568" font-size="20" fill="#1c6170" font-weight="700">J</text><text x="677" y="568" font-size="19" fill="#29465e" font-weight="400">80개</text><rect x="303" y="599" width="505" height="47" rx="6" fill="#f6f8fb" stroke="none"/><text x="322" y="624" font-size="18" fill="#29465e" font-weight="400">1,201–3,200</text><text x="551" y="624" font-size="20" fill="#1c6170" font-weight="700">K</text><text x="677" y="624" font-size="19" fill="#29465e" font-weight="400">125개</tex