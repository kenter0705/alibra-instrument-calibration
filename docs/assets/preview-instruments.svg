<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d"><title id="t">계측기 전체 목록과 관리대장 미리보기</title><desc id="d">부서, 보유 상태, 분실, 폐기, 검교정 의뢰 상태를 필터링하는 계측기 목록과 상세 관리대장</desc><defs><style>.ui{font-family:'Segoe UI','Malgun Gothic',sans-serif}.ink{fill:#223650}.muted{fill:#71839b}.small{font-size:13px}.tiny{font-size:11px}</style></defs><rect width="1280" height="800" fill="#f4f7fb"/><rect width="230" height="800" fill="#1d3152"/><rect x="24" y="24" width="40" height="40" rx="11" fill="#3d5e95"/><text class="ui" x="75" y="49" font-size="20" fill="#fff" font-weight="700">CALIBRA</text><text class="ui" x="32" y="112" font-size="11" fill="#9eafc8" letter-spacing="2">WORKSPACE</text><g class="ui" font-size="14" fill="#d4dfef"><text x="30" y="165">▦　대시보드</text><rect x="14" y="186" width="202" height="42" rx="8" fill="#4b70c5"/><text x="30" y="213" fill="#fff" font-weight="700">◉　계측기 관리</text><text x="30" y="270">▦　검교정 계획</text><text x="30" y="322">▣　검교정 이력</text><text x="30" y="374">⌁　구매 관리</text><text x="30" y="426">↗　불출 및 반납</text><text x="30" y="478">ⓘ　분실 및 폐기</text><text x="30" y="530">✓　전자결재</text><text x="30" y="582">⌁　통계적 공정관리</text></g><rect x="230" width="1050" height="66" fill="#fff"/><path d="M230 66H1280" stroke="#dce5f0"/><text class="ui muted" x="263" y="40" font-size="13">워크스페이스　/　계측기 관리</text><text class="ui muted" x="1100" y="40" font-size="12">⌕　검색　　관리자 ▾</text><text class="ui muted tiny" x="268" y="112" letter-spacing="1.5">INSTRUMENT ASSET REGISTER</text><text class="ui ink" x="268" y="151" font-size="29" font-weight="600">계측기 전체 목록</text><text class="ui muted small" x="268" y="178">관리번호부터 위치, 상태와 검교정 정보를 검색합니다.</text><rect x="1075" y="116" width="168" height="42" rx="8" fill="#4d72cc"/><text class="ui" x="1159" y="142" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">＋ 계측기 등록</text><g class="ui"><rect x="268" y="205" width="975" height="74" rx="11" fill="#fff" stroke="#dce5f0"/><rect x="286" y="222" w