<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">계측기 구매 검토와 전자결재 화면 미리보기</title>
  <desc id="desc">구매 필요성, 사양과 예산 검토, 순차 결재 진행 상태를 보여주는 소개용 화면</desc>
  <defs><style>.ui{font-family:'Segoe UI','Malgun Gothic',sans-serif}.ink{fill:#20334b}.muted{fill:#71839b}.small{font-size:13px}.tiny{font-size:11px}</style></defs>
  <rect width="1280" height="800" fill="#f4f7fb"/><rect width="230" height="800" fill="#1d3152"/>
  <rect x="24" y="24" width="40" height="40" rx="11" fill="#3d5e95"/><text class="ui" x="75" y="49" font-size="20" fill="#fff" font-weight="700">CALIBRA</text>
  <text class="ui" x="32" y="112" font-size="11" fill="#9eafc8" letter-spacing="2">WORKSPACE</text>
  <g class="ui" font-size="14" fill="#d4dfef"><text x="30" y="165">▦　대시보드</text><text x="30" y="217">◉　계측기 관리</text><text x="30" y="269">▦　검교정 계획</text><text x="30" y="321">▣　검교정 이력</text><rect x="14" y="342" width="202" height="42" rx="8" fill="#4b70c5"/><text x="30" y="369" fill="#fff" font-weight="700">⌁　구매 관리</text><text x="30" y="426">✓　전자결재</text><text x="30" y="478">⌁　통계적 공정관리</text></g>
  <rect x="230" width="1050" height="66" fill="#fff"/><path d="M230 66H1280" stroke="#dce5f0"/><text class="ui muted" x="263" y="40" font-size="13">워크스페이스　/　구매 관리　/　구매 검토</text><text class="ui muted" x="1100" y="40" font-size="12">⌕　검색　　관리자 ▾</text>
  <text class="ui muted tiny" x="268" y="112" letter-spacing="1.5">PURCHASE REVIEW · ELECTRONIC APPROVAL</text><text class="ui ink" x="268" y="151" font-size="29" font-weight="600">계측기 구매 검토서</text><text class="ui muted small" x="268" y="178">구매 필요성, 사양, 예산과 결재 진행 상태를 검토합니다.</text>
  <rect x="1068" y="116" width="175" height="42" rx="8" fill="#4d72cc"/><text class="ui" x="1155" y="142" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">＋ 신규 구매 검토서</text>
  <rect x="268" y="205" width="975" height="82" rx="11" fill="#fff" stroke="#dce5f0"/><text class="ui muted tiny" x="289" y="232">검토 진행</text><text class="ui ink" x="289" y="263" font-size="18" font-weight="700">결재 대기 2건</text>
  <g class="ui tiny"><rect x="890" y="225" width="93" height="34" rx="17" fill="#edf3ff"/><text x="936" y="247" text-anchor="middle" fill="#4269bc">검토 1건</text><rect x="994" y="225" width="93" height="34" rx="17" fill="#fff4df"/><text x="1040" y="247" text-anchor="middle" fill="#a97524">승인 1건</text><rect x="1098" y="225" width="123" height="34" rx="17" fill="#e9f6ef"/><text x="1159" y="247" text-anchor="middle" fill="#27865b">발주 전 검토</text></g>
  <rect x="268" y="307" width="975" height="445" rx="12" fill="#fff" stroke="#dce5f0"/><text class="ui ink" x="292" y="343" font-size="17" font-weight="700">구매 검토 목록</text><text class="ui muted tiny" x="292" y="366">요청 사유와 사양·예산을 확인하고 결재 흐름을 추적합니다.</text>
