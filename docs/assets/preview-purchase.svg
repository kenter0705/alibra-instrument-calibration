  <g class="ui small ink"><text x="302" y="548">PUR-2026-007</text><text x="425" y="543" font-weight="700">정밀 압력계</text><text x="425" y="563" class="muted tiny">시험설비 압력 확인 · 이도윤</text><text x="650" y="548">품질팀 · 1대</text><text x="790" y="548">₩ 680,000</text><text x="930" y="548">1차 검토　→　최종 승인</text></g><rect x="1101" y="527" width="91" height="26" rx="13" fill="#e9f6ef"/><text class="ui tiny" x="1146" y="545" text-anchor="middle" fill="#27865b" font-weight="700">승인 완료</text><path d="M287 583H1225" stroke="#e8edf3"/>
  <rect x="292" y="620" width="907" height="100" rx="10" fill="#f8faff" stroke="#e2eaf4"/><text class="ui ink" x="312" y="650" font-size="14" font-weight="700">결재 흐름</text>
