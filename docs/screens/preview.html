class="btn primary" id="close" type="button">이 창 닫기</button></div></div></header><main class="wrap"><div class="eyebrow" id="eyebrow">SCREEN PREVIEW</div><h1 class="title" id="title"></h1><p class="summary" id="summary"></p><div class="imagebox"><img id="preview" alt=""></div><div class="foot"><span>화면 구성 예시 · 업무 데이터와 실제 작동 화면이 아닌 소개용 시안입니다.</span><a class="btn" href="../index.html#screens" target="_blank" rel="noopener">다른 화면 보기 ↗</a></div></main><script>(()=>{const data=[{title:"홈 대시보드",file:"../assets/preview-dashboard.svg",summary:"계측기 보유 현황, 검교정 계획 대비 실적, 다가오는 일정과 주요 업무 바로가기를 한눈에 봅니다."},{title:"계측기 전체 목록·관리대장",file:"../assets/preview-instruments.svg",summary:"관리번호, 계측기명, 부서, 위치, 상태, 차기 검교정일을 검색하고 관리대장 형태로 확인합니다."},{title:"검교정 계획·이력",file:"../assets/preview-calibration.svg",summary:"연간 계획과 실적, 결과, 검교정 기관, 성적서 첨부 이력을 관리하는 화면 구성입니다."},{title:"SPC·공정능력 분석",file:"../assets/preview-spc.svg",summary:"입력 데이터의 분포와 규격, 공정능력 지표를 확인하는 분석 화면 구성입니다."},{title:"교육 자료·자격 관리",file:"../assets/preview-training.svg",summary:"교육 교재 목록, 교육 이수 및 특별특성 공정 작업자 자격 현황을 관리합니다."},{title:"구매 검토·전자결재",file:"../assets/preview-purchase.svg",summary:"계측기 구매 필요성과 사양·예산 검토 내용을 작성하고 순차 결재 현황을 확인합니다."}];const q=new URLSearchParams(location.search);const n=Number(q.get("screen"));const i=Number.isInteger(n)&&n>=0&&n<data.length?n:0;const s=data[i];document.title=`${s.title} · CALIBRA`;document.getElementById("eyebrow").textContent=`SCREEN 0${i+1} / ${data.length}`;document.getElementById("title").textContent=s.title;document.getElementById("summary").textContent=s.summary;const image=document.getElementById("preview");image.src=s.file;image.alt=s.title+" 화면 시안";document.getElementById("close").addEventListener("click",()=>{window.close();setTimeout(()=>{if(!window.closed)location.href="../index.html#screens"},150)})})();</script></body></html>
