<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">앙부일구 해시계 일러스트</title>
  <desc id="desc">돌 바닥 위 받침대에 놓인 청동빛 반구형 오목 해시계와 내부 눈금 및 그림자 막대</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#F7FAFD"/><stop offset="1" stop-color="#DCE7F0"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#D7D9D4"/><stop offset="1" stop-color="#AEB6B4"/></linearGradient>
    <linearGradient id="bronze" x1=".18" y1=".08" x2=".86" y2=".95"><stop stop-color="#D8D2B8"/><stop offset=".28" stop-color="#77796D"/><stop offset=".58" stop-color="#353D3D"/><stop offset=".82" stop-color="#858273"/><stop offset="1" stop-color="#252E31"/></linearGradient>
    <radialGradient id="bowl" cx=".5" cy=".05" r=".9"><stop stop-color="#78817D"/><stop offset=".48" stop-color="#3B4545"/><stop offset="1" stop-color="#182527"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E3DAB8"/><stop offset=".35" stop-color="#6E7167"/><stop offset=".62" stop-color="#C5B889"/><stop offset="1" stop-color="#555D59"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F1D795"/><stop offset=".48" stop-color="#B58E42"/><stop offset="1" stop-color="#70552E"/></linearGradient>
    <filter id="shadow" x="100" y="110" width="1000" height="310" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="15"/></filter>
    <clipPath id="inside"><ellipse cx="610" cy="201" rx="391" ry="112"/></clipPath>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#sky)"/>
